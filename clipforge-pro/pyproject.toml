[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge-pro"
version = "1.0.0"
description = "Local, unlimited, no-watermark short-form clip generation. An Opus Clip alternative that runs on your own machine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["video", "shorts", "tiktok", "clips", "whisper", "ffmpeg", "opus-clip"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Conversion",
]

dependencies = [
    "faster-whisper>=1.0",
    "numpy>=1.24",
    # OpenCV 5 removed CascadeClassifier and ships no Haar cascade data, which
    # takes away the documented YuNet -> Haar fallback. The code degrades
    # gracefully on 5.x, but 4.x is what gives you both detectors.
    "opencv-python-headless>=4.8,<5",
    # messages.parse() + output_config for structured clip selection.
    "anthropic>=2.0",
    "yt-dlp>=2024.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
cfp = "cfp.cli:main"

[project.urls]
Homepage = "https://github.com/KPScriptz/PepStudio/tree/main/clipforge-pro"

[tool.setuptools]
packages = ["cfp"]

[tool.setuptools.package-data]
cfp = ["assets/*.onnx", "assets/*.xml"]
